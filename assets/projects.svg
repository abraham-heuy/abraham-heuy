  <rect x="2" y="298" width="696" height="44" fill="url(#rowodd)"/>
  <text x="20" y="318" font-family="'Courier New', Courier, monospace" font-size="12" fill="#f0abfc" font-weight="bold">hiWorld</text>
  <text x="175" y="312" font-family="'Courier New', Courier, monospace" font-size="11" fill="#c4b5fd">Legacy social platform (MySpace tribute)</text>
  <text x="175" y="327" font-family="'Courier New', Courier, monospace" font-size="11" fill="#c4b5fd">exploring retro web architecture.</text>
  <text x="554" y="318" font-family="'Courier New', Courier, monospace" font-size="10" fill="#7c3aed">React · TypeScript</text>
  <text x="554" y="332" font-family="'Courier New', Courier, monospace" font-size="10" fill="#7c3aed">Node.js</text>
  <line x1="2" y1="342" x2="698" y2="342" stroke="#1e0040" stroke-width="1"/>

