  <rect x="2" y="342" width="696" height="44" fill="url(#roweven)"/>
  <text x="20" y="362" font-family="'Courier New', Courier, monospace" font-size="12" fill="#f0abfc" font-weight="bold">DailyNoise</text>
  <text x="175" y="356" font-family="'Courier New', Courier, monospace" font-size="11" fill="#c4b5fd">Encryption practice tool — basic ciphers</text>
  <text x="175" y="371" font-family="'Courier New', Courier, monospace" font-size="11" fill="#c4b5fd">and hashing implementations.</text>
  <text x="554" y="362" font-family="'Courier New', Courier, monospace" font-size="10" fill="#7c3aed">TypeScript · Node.js</text>
  <line x1="2" y1="386" x2="698" y2="386" stroke="#5b21b6" stroke-width="1"/>

  <!-- Continuous / seeking contributions section -->
  <rect x="2" y="386" width="696" height="22" fill="#0d0025"/>
  <text x="20" y="401" font-family="'Courier New', Courier, monospace" font-size="10" fill="#5b21b6" letter-spacing="2">CONTINUOUS PROJECTS — SEEKING CONTRIBUTIONS</text>

  <line x1="2" y1="408" x2="698" y2="408" stroke="#3b0764" stroke-width="1"/>

  <!-- 2Wajibike -->
  <rect x="2" y="408" width="696" height="38" fill="url(#rowodd)"/>
  <text x="20" y="425" font-family="'Courier New', Courier, monospace" font-size="12" fill="#06b6d4" font-weight="bold">2Wajibike</text>
  <text x="175" y="419" font-family="'Courier New', Courier, monospace" font-size="11" fill="#c4b5fd">Prediction algorithms and leader scoring</text>
  <text x="175" y="434" font-family="'Courier New', Courier, monospace" font-size="11" fill="#c4b5fd">ahead of the 2027 Kenyan elections.</text>
  <line x1="2" y1="446" x2="698" y2="446" stroke="#1e0040" stroke-width="1"/>

  <!-- e-Tala scaling -->
  <rect x="2" y="446" width="696" height="38" fill="url(#roweven)"/>
  <text x="20" y="463" font-family="'Courier New', Courier, monospace" font-size="12" fill="#06b6d4" font-weight="bold">e-Tala (scaling)</text>
  <text x="175" y="457" font-family="'Courier New', Courier, monospace" font-size="11" fill="#c4b5fd">Ongoing feature development and</text>
  <text x="175" y="472" font-family="'Courier New', Courier, monospace" font-size="11" fill="#c4b5fd">scaling improvements.</text>
  <line x1="2" y1="484" x2="698" y2="484" stroke="#5b21b6" stroke-width="1"/>

  <!-- Private note -->
  <rect x="2" y="484" width="696" height="88" fill="#050010"/>
  <text x="350" y="508" font-family="'Courier New', Courier, monospace" font-size="11" fill="#3b0764" text-anchor="middle">// ─────────────────────────────────────────────────</text>
  <text x="350" y="526" font-family="'Courier New', Courier, monospace" font-size="11" fill="#7c3aed" text-anchor="middle">Several active projects are connected to organisations</text>
  <text x="350" y="542" font-family="'Courier New', Courier, monospace" font-size="11" fill="#7c3aed" text-anchor="middle">and private individuals and are not displayed publicly.</text>
  <text x="350" y="560" font-family="'Courier New', Courier, monospace" font-size="11" fill="#3b0764" text-anchor="middle">// ─────────────────────────────────────────────────</text>

  <!-- Bottom accent line -->
  <rect x="10" y="577" width="680" height="1.5" fill="url(#botline)"/>

  <!-- Blinking cursor -->
  <rect x="660" y="558" width="8" height="13" fill="#7c3aed" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
